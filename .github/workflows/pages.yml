# Publishes the committed test page (test-page/) to GitHub Pages. Nothing is built here: the folder is
# uploaded as it is. It only runs for the main branch, which is the branch the Pages environment allows.
name: Deploy test page

on:
  push:
    branches: [main]
    paths:
      - "test-page/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: test-page
      - id: deployment
        uses: actions/deploy-pages@v4
